<!doctype html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin – Praxis</title><meta name="robots" content="noindex">
<link rel="stylesheet" href="/admin/admin.css"></head>
<body>
<div id="login" class="login hidden">
  <form id="loginForm" class="login-card">
    <div class="logo">
      <svg viewBox="0 0 34 34" width="44" height="44"><circle cx="17" cy="17" r="17" fill="#3f7d6b"/><path d="M9 20c3-9 13-9 16 0-4 5-12 5-16 0z" fill="#fff"/><circle cx="17" cy="12" r="3" fill="#e07a5f"/></svg>
    </div>
    <h1>Praxis-Verwaltung</h1><p class="muted">Bitte melden Sie sich an.</p>
    <div id="loginErr" class="err hidden"></div>
    <label>Benutzername<input name="username" autocomplete="username" required autofocus></label>
    <label>Passwort<input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn">Anmelden</button>
    <a href="/" class="muted small">← Zur Website</a>
  </form>
</div>

<div id="app" class="app hidden">
  <aside class="side" id="side">
    <div class="side-brand"><svg viewBox="0 0 34 34" width="32" height="32"><circle cx="17" cy="17" r="17" fill="#fff"/><path d="M9 20c3-9 13-9 16 0-4 5-12 5-16 0z" fill="#3f7d6b"/></svg><span>Verwaltung</span></div>
    <nav id="nav">
      <a href="#dashboard" data-v="dashboard"><i>▦</i>Übersicht</a>
      <a href="#termine" data-v="termine"><i>◷</i>Termine <b id="badge" class="badge hidden"></b></a>
      <a href="#website" data-v="website"><i>✎</i>Website gestalten</a>
      <a href="#leistungen" data-v="leistungen"><i>✚</i>Leistungen</a>
      <a href="#zeiten" data-v="zeiten"><i>☰</i>Zeiten &amp; Urlaub</a>
      <a href="#einstellungen" data-v="einstellungen"><i>⚙</i>Einstellungen</a>
    </nav>
    <div class="side-foot"><a href="/" target="_blank">Website ansehen ↗</a><button id="logout" class="link">Abmelden</button></div>
  </aside>
  <div class="main">
    <header class="top"><button id="menuBtn" class="menu-btn" aria-label="Menü">☰</button><h1 id="title"></h1><span id="who" class="muted small"></span></header>
    <div id="view" class="view"></div>
  </div>
</div>
<div id="toast" class="toast"></div>
<dialog id="dlg"></dialog>
<script src="/admin/admin.js"></script>
</body></html>
